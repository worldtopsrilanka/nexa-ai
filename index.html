<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexa AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  height:100vh;
  background:#0b1020;
  color:#fff;
  font-family:Arial, sans-serif;
}

.app{
  height:100vh;
  max-width:900px;
  margin:auto;
  display:flex;
  flex-direction:column;
  background:#111827;
}

/* HEADER */

.header{
  height:70px;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #263244;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.logo span{
  color:#60a5fa;
}

.status{
  color:#6ee7b7;
  font-size:13px;
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;
  padding:25px 20px;
}

.msg{
  max-width:82%;
  padding:14px 17px;
  margin-bottom:15px;
  border-radius:17px;
  line-height:1.5;
  white-space:pre-wrap;
  word-wrap:break-word;
}

.ai{
  background:#1f2937;
  margin-right:auto;
}

.user{
  background:#2563eb;
  margin-left:auto;
}

/* INPUT */

.input-area{
  padding:15px;
  border-top:1px solid #263244;
  display:flex;
  gap:10px;
  background:#111827;
}

textarea{
  flex:1;
  height:52px;
  resize:none;
  padding:15px;
  border-radius:14px;
  border:1px solid #374151;
  background:#0b1220;
  color:white;
  outline:none;
  font-size:15px;
}

textarea:focus{
  border-color:#2563eb;
}

button{
  width:85px;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

button:disabled{
  background:#374151;
  cursor:not-allowed;
}

/* MOBILE */

@media(max-width:600px){

  .logo{
    font-size:21px;
  }

  .msg{
    max-width:90%;
  }

  .input-area{
    padding:10px;
  }

  button{
    width:70px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">

    <div class="logo">
      ✦ <span>Nexa</span> AI
    </div>

    <div class="status">
      ● Online
    </div>

  </div>


  <!-- CHAT -->

  <div class="chat" id="chat">

    <div class="msg ai">
Hello! I'm Nexa AI. 👋

How can I help you today?
    </div>

  </div>


  <!-- INPUT -->

  <div class="input-area">

    <textarea
      id="q"
      placeholder="Message Nexa AI..."
      onkeydown="handleKey(event)"
    ></textarea>

    <button
      id="sendButton"
      onclick="sendMessage()"
    >
      Send
    </button>

  </div>

</div>


<script>

/* ADD MESSAGE */

function addMessage(text, type){

  const chat = document.getElementById("chat");

  const message = document.createElement("div");

  message.className = "msg " + type;

  message.textContent = text;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;

  return message;
}


/* SEND MESSAGE */

async function sendMessage(){

  const input = document.getElementById("q");

  const button = document.getElementById("sendButton");

  const text = input.value.trim();

  if(!text){
    return;
  }


  /* USER MESSAGE */

  addMessage(text, "user");

  input.value = "";

  button.disabled = true;

  button.textContent = "...";


  /* THINKING MESSAGE */

  const thinking = addMessage(
    "Nexa AI is thinking... 🤔",
    "ai"
  );


  try{

    const response = await fetch("/api/chat", {

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        message:text
      })

    });


    const data = await response.json();


    /* REMOVE THINKING */

    thinking.remove();


    /* AI RESPONSE */

    if(data.reply){

  addMessage(data.reply, "ai");

}else{

  addMessage(
    "Error: " + (data.error || "Unknown error"),
    "ai"
  );

    }
  }catch(error){

    thinking.remove();

    addMessage(
      "Connection error. Please try again. ❌",
      "ai"
    );

    console.error(error);

  }


  button.disabled = false;

  button.textContent = "Send";
}


/* ENTER KEY */

function handleKey(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();

  }

}

</script>

</body>
</html>
