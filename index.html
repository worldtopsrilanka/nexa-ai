<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexa AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b1020;
  color:white;
  font-family:Arial,sans-serif;
  height:100vh;
}

.app{
  height:100vh;
  max-width:900px;
  margin:auto;
  display:flex;
  flex-direction:column;
  background:#111827;
}

.header{
  padding:18px 20px;
  border-bottom:1px solid #263244;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:700;
}

.status{
  font-size:13px;
  color:#6ee7b7;
}

.chat{
  flex:1;
  overflow:auto;
  padding:22px;
}

.msg{
  max-width:82%;
  padding:13px 16px;
  margin-bottom:14px;
  border-radius:16px;
  line-height:1.5;
  white-space:pre-wrap;
}

.ai{
  background:#1f2937;
}

.user{
  background:#2563eb;
  margin-left:auto;
}

.input{
  display:flex;
  gap:10px;
  padding:14px;
  border-top:1px solid #263244;
}

textarea{
  flex:1;
  height:52px;
  resize:none;
  background:#0b1220;
  color:white;
  border:1px solid #374151;
  border-radius:13px;
  padding:14px;
  outline:none;
}

button{
  width:82px;
  border:0;
  border-radius:13px;
  background:#2563eb;
  color:white;
  font-weight:bold;
}

@media(max-width:600px){
  .msg{max-width:90%}
  .logo{font-size:21px}
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">✦ Nexa AI</div>
    <div class="status">● Online</div>
  </div>

  <div class="chat" id="chat">

    <div class="msg ai">
Hello! I'm Nexa AI. 👋

How can I help you?
    </div>

  </div>

  <div class="input">

    <textarea
      id="q"
      placeholder="Message Nexa AI..."
      onkeydown="key(event)">
    </textarea>

    <button onclick="send()">Send</button>

  </div>

</div>

<script>

function add(text,who){

  const d=document.createElement("div");

  d.className="msg "+who;

  d.textContent=text;

  document.getElementById("chat").appendChild(d);

  d.scrollIntoView({
    behavior:"smooth"
  });
}


function send(){

  const q=document.getElementById("q");

  const text=q.value.trim();

  if(!text)return;

  add(text,"user");

  q.value="";

  setTimeout(function(){

    add(
      "I'm Nexa AI. My AI brain is not connected yet. 🤖",
      "ai"
    );

  },600);
}


function key(e){

  if(e.key==="Enter" && !e.shiftKey){

    e.preventDefault();

    send();

  }

}

</script>

</body>
</html>
