<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Avenqor AI</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#0b1020;
  color:#fff;
}

body{
  overflow:hidden;
}

.app{
  width:100%;
  height:100vh;
  display:flex;
  background:#111827;
}

/* SIDEBAR */

.sidebar{
  width:260px;
  background:#0b1220;
  border-right:1px solid #263244;
  display:flex;
  flex-direction:column;
  padding:15px;
}

.brand{
  font-size:23px;
  font-weight:bold;
  padding:10px 8px 20px;
}

.brand span{
  color:#60a5fa;
}

.new-chat{
  width:100%;
  padding:13px;
  border:1px solid #334155;
  border-radius:12px;
  background:#172033;
  color:white;
  cursor:pointer;
  font-weight:bold;
  margin-bottom:15px;
}

.new-chat:hover{
  background:#1e293b;
}

.history-title{
  color:#94a3b8;
  font-size:12px;
  padding:8px;
}

.history{
  flex:1;
  overflow-y:auto;
}

.history-item{
  padding:11px;
  border-radius:10px;
  color:#dbeafe;
  cursor:pointer;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-item:hover{
  background:#172033;
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

/* HEADER */

.header{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  border-bottom:1px solid #263244;
}

.mobile-menu{
  display:none;
  border:none;
  background:none;
  color:white;
  font-size:22px;
  cursor:pointer;
}

.title{
  font-size:20px;
  font-weight:bold;
}

.title span{
  color:#60a5fa;
}

.status{
  color:#6ee7b7;
  font-size:13px;
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;
  padding:30px 20px;
}

.message-row{
  display:flex;
  margin-bottom:18px;
}

.message-row.user{
  justify-content:flex-end;
}

.message{
  max-width:78%;
  padding:14px 17px;
  border-radius:18px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}

.message.ai{
  background:#1f2937;
}

.message.user{
  background:#2563eb;
}

.actions{
  display:flex;
  gap:6px;
  margin-top:7px;
}

.action-btn{
  border:0;
  background:#172033;
  color:#94a3b8;
  padding:5px 8px;
  border-radius:7px;
  cursor:pointer;
  font-size:12px;
}

.action-btn:hover{
  color:white;
  background:#263244;
}

/* WELCOME */

.welcome{
  max-width:700px;
  margin:80px auto;
  text-align:center;
}

.welcome h1{
  font-size:38px;
  margin-bottom:10px;
}

.welcome h1 span{
  color:#60a5fa;
}

.welcome p{
  color:#94a3b8;
}

.suggestions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  margin-top:25px;
}

.suggestion{
  background:#172033;
  border:1px solid #334155;
  color:#dbeafe;
  padding:11px 14px;
  border-radius:12px;
  cursor:pointer;
}

.suggestion:hover{
  background:#1e293b;
}

/* INPUT */

.input-wrapper{
  padding:15px 20px 18px;
  border-top:1px solid #263244;
  background:#111827;
}

.input-area{
  max-width:900px;
  margin:auto;
  display:flex;
  gap:10px;
}

textarea{
  flex:1;
  height:54px;
  resize:none;
  padding:16px;
  border-radius:15px;
  border:1px solid #374151;
  background:#0b1220;
  color:white;
  outline:none;
  font-size:15px;
}

textarea:focus{
  border-color:#2563eb;
}

.send{
  width:80px;
  border:0;
  border-radius:15px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.send:hover{
  background:#1d4ed8;
}

.send:disabled{
  background:#374151;
  cursor:not-allowed;
}

.disclaimer{
  text-align:center;
  color:#64748b;
  font-size:11px;
  margin-top:8px;
}

/* MOBILE */

@media(max-width:700px){

  .sidebar{
    position:fixed;
    left:-270px;
    top:0;
    bottom:0;
    z-index:20;
    transition:.25s;
  }

  .sidebar.open{
    left:0;
  }

  .mobile-menu{
    display:block;
  }

  .header{
    padding:0 12px;
  }

  .status{
    display:none;
  }

  .chat{
    padding:20px 12px;
  }

  .message{
    max-width:90%;
  }

  .welcome{
    margin:50px auto;
  }

  .welcome h1{
    font-size:30px;
  }

  .input-wrapper{
    padding:10px;
  }

  .send{
    width:65px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      ✦ <span>Avenqor</span> AI
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ New Chat
    </button>

    <div class="history-title">
      CHAT HISTORY
    </div>

    <div class="history" id="history"></div>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <header class="header">

      <button class="mobile-menu" onclick="toggleSidebar()">
        ☰
      </button>

      <div class="title">
        <span>Avenqor</span> AI
      </div>

      <div class="status">
        ● Online
      </div>

    </header>


    <!-- CHAT -->

    <section class="chat" id="chat">

      <div class="welcome" id="welcome">

        <h1>
          Hello, I'm <span>Avenqor AI</span> 👋
        </h1>

        <p>
          Your intelligent AI assistant.
        </p>

        <div class="suggestions">

          <button class="suggestion"
            onclick="useSuggestion('Explain quantum physics simply')">
            Explain something
          </button>

          <button class="suggestion"
            onclick="useSuggestion('Help me write a program')">
            Help with coding
          </button>

          <button class="suggestion"
            onclick="useSuggestion('Help me study biology')">
            Study with me
          </button>

        </div>

      </div>

    </section>


    <!-- INPUT -->

    <div class="input-wrapper">

      <div class="input-area">

        <textarea
          id="q"
          placeholder="Message Avenqor AI..."
          onkeydown="handleKey(event)"
        ></textarea>

        <button
          class="send"
          id="sendButton"
          onclick="sendMessage()"
        >
          Send
        </button>

      </div>

      <div class="disclaimer">
        Avenqor AI is powered by Google Gemini.
      </div>

    </div>

  </main>

</div>


<script>

let messages = [];
let currentChat = [];


/* STORAGE */

function saveChats(){

  localStorage.setItem(
    "avenqor_chats",
    JSON.stringify(messages)
  );

}


function loadChats(){

  const saved =
    localStorage.getItem("avenqor_chats");

  if(saved){

    try{
      messages = JSON.parse(saved);
    }catch{
      messages = [];
    }

  }

  renderHistory();

}


/* HISTORY */

function renderHistory(){

  const history =
    document.getElementById("history");

  history.innerHTML = "";

  messages.forEach((chat,index)=>{

    const item =
      document.createElement("div");

    item.className = "history-item";

    item.textContent =
      chat.title || "New Chat";

    item.onclick = () =>
      loadChat(index);

    history.appendChild(item);

  });

}


function loadChat(index){

  currentChat =
    messages[index].messages || [];

  renderChat();

  closeSidebar();

}


function renderChat(){

  const chat =
    document.getElementById("chat");

  chat.innerHTML = "";

  if(currentChat.length === 0){

    showWelcome();

    return;

  }

  currentChat.forEach(item=>{

    addMessageToUI(
      item.text,
      item.type,
      false
    );

  });

}


function showWelcome(){

  const chat =
    document.getElementById("chat");

  chat.innerHTML = `
    <div class="welcome" id="welcome">

      <h1>
        Hello, I'm <span>Avenqor AI</span> 👋
      </h1>

      <p>
        Your intelligent AI assistant.
      </p>

      <div class="suggestions">

        <button class="suggestion"
          onclick="useSuggestion('Explain quantum physics simply')">
          Explain something
        </button>

        <button class="suggestion"
          onclick="useSuggestion('Help me write a program')">
          Help with coding
        </button>

        <button class="suggestion"
          onclick="useSuggestion('Help me study biology')">
          Study with me
        </button>

      </div>

    </div>
  `;

}


/* ADD MESSAGE */

function addMessageToUI(text,type,actions=true){

  const chat =
    document.getElementById("chat");

  const row =
    document.createElement("div");

  row.className =
    "message-row " + type;

  const box =
    document.createElement("div");

  box.className =
    "message " + type;

  box.textContent = text;

  row.appendChild(box);

  chat.appendChild(row);

  if(type === "ai" && actions){

    const actionsDiv =
      document.createElement("div");

    actionsDiv.className =
      "actions";

    const copy =
      document.createElement("button");

    copy.className =
      "action-btn";

    copy.textContent =
      "📋 Copy";

    copy.onclick = () =>
      copyText(text);

    const regenerate =
      document.createElement("button");

    regenerate.className =
      "action-btn";

    regenerate.textContent =
      "🔄 Regenerate";

    regenerate.onclick =
      regenerateLast;

    actionsDiv.appendChild(copy);

    actionsDiv.appendChild(regenerate);

    box.appendChild(actionsDiv);

  }

  chat.scrollTop =
    chat.scrollHeight;

  return box;

}


/* SEND */

async function sendMessage(){

  const input =
    document.getElementById("q");

  const button =
    document.getElementById("sendButton");

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  const welcome =
    document.getElementById("welcome");

  if(welcome){
    welcome.remove();
  }

  addMessageToUI(
    text,
    "user",
    false
  );

  currentChat.push({
    text:text,
    type:"user"
  });

  input.value = "";

  button.disabled = true;

  button.textContent = "...";


  const thinking =
    addMessageToUI(
      "Avenqor AI is thinking... 🤔",
      "ai",
      false
    );


  try{

    const response =
      await fetch("/api/chat",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          message:text
        })

      });


    const data =
      await response.json();


    thinking.parentElement.remove();


    if(data.reply){

      addMessageToUI(
        data.reply,
        "ai",
        true
      );

      currentChat.push({
        text:data.reply,
        type:"ai"
      });

      saveCurrentChat();

    }else{

      addMessageToUI(
        "Error: " +
        (data.error || "Unknown error"),
        "ai",
        false
      );

    }

  }catch(error){

    thinking.parentElement.remove();

    addMessageToUI(
      "Connection error. Please try again. ❌",
      "ai",
      false
    );

    console.error(error);

  }


  button.disabled = false;

  button.textContent = "Send";

}


/* SAVE CURRENT CHAT */

function saveCurrentChat(){

  if(currentChat.length === 0){
    return;
  }

  const firstUser =
    currentChat.find(x=>x.type==="user");

  const title =
    firstUser
      ? firstUser.text.slice(0,35)
      : "New Chat";


  const existing =
    messages.findIndex(
      x => x.messages === currentChat
    );


  if(existing === -1){

    messages.unshift({
      title:title,
      messages:currentChat
    });

  }

  saveChats();

  renderHistory();

}


/* NEW CHAT */

function newChat(){

  currentChat = [];

  showWelcome();

  document.getElementById("q").value = "";

  closeSidebar();

}


/* REGENERATE */

async function regenerateLast(){

  if(currentChat.length < 2){
    return;
  }

  const lastUser =
    [...currentChat]
      .reverse()
      .find(x=>x.type==="user");

  if(!lastUser){
    return;
  }

  document.getElementById("q").value =
    lastUser.text;

  await sendMessage();

}


/* COPY */

async function copyText(text){

  try{

    await navigator.clipboard.writeText(text);

    alert("Copied!");

  }catch{

    alert("Copy failed");

  }

}


/* SUGGESTION */

function useSuggestion(text){

  document.getElementById("q").value =
    text;

  sendMessage();

}


/* ENTER */

function handleKey(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();

  }

}


/* SIDEBAR */

function toggleSidebar(){

  document
    .getElementById("sidebar")
    .classList.toggle("open");

}


function closeSidebar(){

  document
    .getElementById("sidebar")
    .classList.remove("open");

}


/* START */

loadChats();

</script>

</body>
</html>
