<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avenqor AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  background:#0b1020;
  color:white;
  font-family:Arial,sans-serif;
}

.app{
  height:100vh;
  display:flex;
}

.sidebar{
  width:260px;
  background:#0a1120;
  border-right:1px solid #263244;
  padding:15px;
  display:flex;
  flex-direction:column;
}

.logo{
  font-size:24px;
  font-weight:bold;
  padding:10px;
}

.logo span{
  color:#60a5fa;
}

.new-chat{
  padding:12px;
  border:1px solid #334155;
  border-radius:12px;
  background:#172033;
  color:white;
  cursor:pointer;
  margin:10px 0 15px;
}

.history{
  overflow-y:auto;
}

.history-item{
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-item:hover{
  background:#172033;
}

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.header{
  height:65px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #263244;
}

.menu{
  display:none;
  background:none;
  border:0;
  color:white;
  font-size:22px;
}

.status{
  color:#6ee7b7;
  font-size:13px;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:25px 18px;
}

.welcome{
  max-width:700px;
  margin:80px auto;
  text-align:center;
}

.welcome h1{
  font-size:38px;
}

.welcome span{
  color:#60a5fa;
}

.welcome p{
  color:#94a3b8;
}

.row{
  display:flex;
  margin-bottom:16px;
}

.row.user{
  justify-content:flex-end;
}

.bubble{
  max-width:82%;
  padding:14px 17px;
  border-radius:18px;
  line-height:1.55;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.row.ai .bubble{
  background:#1f2937;
}

.row.user .bubble{
  background:#2563eb;
}

.actions{
  display:flex;
  gap:6px;
  margin-top:8px;
}

.action{
  border:0;
  background:#172033;
  color:#cbd5e1;
  padding:6px 9px;
  border-radius:8px;
  cursor:pointer;
}

.composer{
  border-top:1px solid #263244;
  padding:12px;
}

.preview{
  display:none;
  max-width:900px;
  margin:auto;
  padding-bottom:8px;
  align-items:center;
  gap:10px;
}

.preview img{
  max-height:100px;
  max-width:150px;
  border-radius:10px;
}

.remove{
  border:0;
  background:#991b1b;
  color:white;
  padding:7px 10px;
  border-radius:8px;
}

.input-area{
  max-width:900px;
  margin:auto;
  display:flex;
  gap:7px;
}

textarea{
  flex:1;
  height:54px;
  resize:none;
  padding:15px;
  border-radius:14px;
  border:1px solid #374151;
  background:#0b1220;
  color:white;
  outline:none;
  font-size:15px;
}

textarea:focus{
  border-color:#2563eb;
}

.tool-btn,
.send{
  border:0;
  border-radius:14px;
  padding:0 13px;
  background:#172033;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

.send{
  background:#2563eb;
}

.send:disabled{
  opacity:.5;
}

.note{
  text-align:center;
  color:#64748b;
  font-size:11px;
  margin-top:7px;
}

@media(max-width:700px){

  .sidebar{
    position:fixed;
    left:-270px;
    top:0;
    bottom:0;
    z-index:10;
    transition:.2s;
  }

  .sidebar.open{
    left:0;
  }

  .menu{
    display:block;
  }

  .status{
    display:none;
  }

  .chat{
    padding:15px 10px;
  }

  .bubble{
    max-width:92%;
  }

  .welcome h1{
    font-size:30px;
  }

  .input-area{
    gap:4px;
  }

  .tool-btn,
  .send{
    padding:0 9px;
  }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

  <div class="logo">
    ✦ <span>Avenqor</span> AI
  </div>

  <button class="new-chat" onclick="newChat()">
    ＋ New Chat
  </button>

  <small>CHAT HISTORY</small>

  <div class="history" id="history"></div>

</aside>


<main class="main">

<header class="header">

  <button class="menu" onclick="toggleSidebar()">
    ☰
  </button>

  <b>
    <span style="color:#60a5fa">Avenqor</span> AI
  </b>

  <div class="status">
    ● Online
  </div>

</header>


<section class="chat" id="chat">

  <div class="welcome" id="welcome">

    <h1>
      Hello, I'm <span>Avenqor AI</span> 👋
    </h1>

    <p>
      Your intelligent AI assistant powered by Google Gemini.
    </p>

  </div>

</section>


<div class="composer">

  <div class="preview" id="preview">

    <img id="previewImg">

    <button class="remove" onclick="removeImage()">
      Remove
    </button>

  </div>


  <div class="input-area">

    <input
      type="file"
      id="file"
      accept="image/*"
      hidden
      onchange="selectImage(event)"
    >

    <button
      class="tool-btn"
      onclick="document.getElementById('file').click()"
      title="Attach image"
    >
      📎
    </button>

    <button
      class="tool-btn"
      onclick="startVoice()"
      title="Voice input"
    >
      🎤
    </button>

    <textarea
      id="q"
      placeholder="Message Avenqor AI..."
      onkeydown="handleKey(event)"
    ></textarea>

    <button
      class="send"
      id="sendButton"
      onclick="sendMessage()"
    >
      Send
    </button>

  </div>

  <div class="note">
    Avenqor AI • Created by Bilal • Powered by Google Gemini
  </div>

</div>

</main>

</div>


<script>

let selectedImage = null;

let currentMessages = [];

let history =
  JSON.parse(
    localStorage.getItem("avenqor_history") || "[]"
  );


/* HISTORY */

function saveHistory(){

  localStorage.setItem(
    "avenqor_history",
    JSON.stringify(history)
  );

  renderHistory();
}


function renderHistory(){

  const box =
    document.getElementById("history");

  box.innerHTML = "";

  history.forEach((chat,index)=>{

    const item =
      document.createElement("div");

    item.className =
      "history-item";

    item.textContent =
      chat.title;

    item.onclick = () => {

      currentMessages =
        chat.messages || [];

      renderMessages();

      closeSidebar();

    };

    box.appendChild(item);

  });

}


/* RENDER */

function renderMessages(){

  const chat =
    document.getElementById("chat");

  chat.innerHTML = "";

  if(!currentMessages.length){

    chat.innerHTML = `
      <div class="welcome">
        <h1>
          Hello, I'm <span>Avenqor AI</span> 👋
        </h1>
        <p>
          Your intelligent AI assistant powered by Google Gemini.
        </p>
      </div>
    `;

    return;
  }


  currentMessages.forEach(msg=>{

    addMessage(
      msg.text,
      msg.type,
      false
    );

  });

}


/* ADD MESSAGE */

function addMessage(
  text,
  type,
  actions=true
){

  const chat =
    document.getElementById("chat");

  const row =
    document.createElement("div");

  row.className =
    "row " + type;

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    text;

  row.appendChild(bubble);

  chat.appendChild(row);


  if(type === "ai" && actions){

    const actionsBox =
      document.createElement("div");

    actionsBox.className =
      "actions";


    const copy =
      document.createElement("button");

    copy.className =
      "action";

    copy.textContent =
      "📋 Copy";

    copy.onclick = () => {

      navigator.clipboard.writeText(text);

    };


    const speak =
      document.createElement("button");

    speak.className =
      "action";

    speak.textContent =
      "🔊 Speak";

    speak.onclick = () => {

      speechSynthesis.cancel();

      speechSynthesis.speak(
        new SpeechSynthesisUtterance(text)
      );

    };


    actionsBox.appendChild(copy);

    actionsBox.appendChild(speak);

    bubble.appendChild(actionsBox);

  }


  chat.scrollTop =
    chat.scrollHeight;

  return row;
}


/* IMAGE */

function selectImage(event){

  const file =
    event.target.files[0];

  if(!file){
    return;
  }

  if(!file.type.startsWith("image/")){

    alert("Please select an image.");

    return;

  }


  const reader =
    new FileReader();

  reader.onload = () => {

    selectedImage = {

      data:
        reader.result.split(",")[1],

      mimeType:
        file.type,

      preview:
        reader.result

    };


    document.getElementById(
      "previewImg"
    ).src =
      reader.result;


    document.getElementById(
      "preview"
    ).style.display =
      "flex";

  };


  reader.readAsDataURL(file);

}


function removeImage(){

  selectedImage = null;

  document.getElementById(
    "file"
  ).value = "";

  document.getElementById(
    "preview"
  ).style.display =
    "none";

}


/* SEND */

async function sendMessage(){

  const input =
    document.getElementById("q");

  const button =
    document.getElementById("sendButton");

  const text =
    input.value.trim();


  if(!text && !selectedImage){
    return;
  }


  const image =
    selectedImage;


  const messageText =
    text ||
    "Please analyze this image.";


  const welcome =
    document.getElementById("welcome");

  if(welcome){
    welcome.remove();
  }


  addMessage(
    messageText,
    "user",
    false
  );


  currentMessages.push({

    text:messageText,

    type:"user"

  });


  input.value = "";

  button.disabled = true;

  button.textContent = "...";


  const thinking =
    addMessage(
      "Avenqor AI is thinking... 🤔",
      "ai",
      false
    );


  try{

    const response =
      await fetch(
        "/api/chat",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              message:
                text,

              image:
                image
                  ? image.data
                  : null,

              mimeType:
                image
                  ? image.mimeType
                  : null

            })

        }
      );


    const data =
      await response.json();


    thinking.remove();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Request failed"
      );

    }


    if(!data.reply){

      throw new Error(
        "Empty response"
      );

    }


    addMessage(
      data.reply,
      "ai",
      true
    );


    currentMessages.push({

      text:data.reply,

      type:"ai"

    });


    saveCurrentChat();

    removeImage();


  }catch(error){

    thinking.remove();

    addMessage(
      "Error: " +
      error.message,
      "ai",
      false
    );

  }


  button.disabled = false;

  button.textContent =
    "Send";

}


/* SAVE */

function saveCurrentChat(){

  if(!currentMessages.length){
    return;
  }


  const first =
    currentMessages.find(
      m => m.type === "user"
    );


  const title =
    first
      ? first.text.slice(0,40)
      : "New Chat";


  history.unshift({

    title:title,

    messages:
      currentMessages

  });


  /* avoid too many duplicates */

  if(history.length > 20){

    history =
      history.slice(0,20);

  }


  saveHistory();

}


/* NEW CHAT */

function newChat(){

  currentMessages = [];

  removeImage();

  document.getElementById(
    "q"
  ).value = "";

  renderMessages();

}


/* VOICE INPUT */

function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    alert(
      "Voice input is not supported in this browser."
    );

    return;

  }


  const recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-US";


  recognition.interimResults =
    false;


  recognition.onresult =
    function(event){

      document.getElementById(
        "q"
      ).value =
        event.results[0][0].transcript;

    };


  recognition.onerror =
    function(){

      alert(
        "Voice input failed."
      );

    };


  recognition.start();

}


/* ENTER */

function handleKey(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();

  }

}


/* MOBILE */

function toggleSidebar(){

  document
    .getElementById("sidebar")
    .classList.toggle("open");

}


function closeSidebar(){

  document
    .getElementById("sidebar")
    .classList.remove("open");

}


/* START */

renderHistory();

renderMessages();

</script>

</body>
</html>
